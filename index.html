<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sample Tracker</title>
  <meta name="description" content="Merchandising and technical sample tracker — choose where you want to start.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='6' fill='%234f46e5'/><path d='M8 22V10h4l4 8 4-8h4v12h-3v-8l-3.5 7h-2L12 14v8z' fill='white'/></svg>">
  <link rel="stylesheet" href="cover.css">
</head>
<body>
  <main class="cover">
    <div class="cover-card">
      <div class="brand">
        <span class="brand-icon" aria-hidden="true">📋</span>
        <div>
          <h1>Sample Tracker</h1>
          <p class="tagline">Merchandising &amp; Technical sample log</p>
        </div>
      </div>

      <p class="prompt">What would you like to do?</p>

      <div class="widget" role="radiogroup" aria-label="Choose a starting point">
        <a class="option" href="tracker.html?section=merch" data-tone="merch">
          <span class="option-icon" aria-hidden="true">📥</span>
          <span class="option-body">
            <span class="option-title">Merchandising Entry</span>
            <span class="option-desc">Log a new sample sent from the factory</span>
          </span>
          <span class="option-arrow" aria-hidden="true">&rsaquo;</span>
        </a>

        <a class="option" href="tracker.html?section=tech" data-tone="tech">
          <span class="option-icon" aria-hidden="true">🔧</span>
          <span class="option-body">
            <span class="option-title">Technical Entry</span>
            <span class="option-desc">Log a check received from the merchant</span>
          </span>
          <span class="option-arrow" aria-hidden="true">&rsaquo;</span>
        </a>

        <a class="option" href="tracker.html?section=all" data-tone="all">
          <span class="option-icon" aria-hidden="true">📊</span>
          <span class="option-body">
            <span class="option-title">View All Entries</span>
            <span class="option-desc">Search, edit, or export the full log</span>
          </span>
          <span class="option-arrow" aria-hidden="true">&rsaquo;</span>
        </a>
      </div>

      <a class="skip-link" href="tracker.html">Or just open the full tracker &rarr;</a>
    </div>
  </main>
</body>
</html>
